name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag, for example v1.2.3
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            executable: rust-htmx-template
            archive: tar.gz
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            executable: rust-htmx-template
            archive: tar.gz
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            executable: rust-htmx-template.exe
            archive: zip

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package release
        id: package
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_NAME: ${{ matrix.name }}
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_EXECUTABLE: ${{ matrix.executable }}
          RELEASE_ARCHIVE: ${{ matrix.archive }}
        run: |
          staging="rust-htmx-template-${RELEASE_VERSION}-${RELEASE_NAME}"
          mkdir -p "$staging"
          cp README.md "$staging/"
          cp "target/${RELEASE_TARGET}/release/${RELEASE_EXECUTABLE}" "$staging/"

          if [[ "$RELEASE_ARCHIVE" == "zip" ]]; then
            7z a "${staging}.zip" "$staging" >/dev/null
            echo "archive=${staging}.zip" >> "$GITHUB_OUTPUT"
          else
            tar czf "${staging}.tar.gz" "$staging"
            echo "archive=${staging}.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload packaged binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged binaries
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          files: dist/*
